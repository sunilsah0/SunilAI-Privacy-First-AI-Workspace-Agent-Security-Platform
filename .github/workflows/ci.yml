name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # the checks can read the code, and nothing else

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: dev_password_change_me
          POSTGRES_DB: verity
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U verity -d verity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint (syntax errors and undefined names)
        run: pip install ruff && ruff check --select E9,F63,F7,F82 services tests scripts migrations
      - name: Create tables and security rules
        run: alembic upgrade head
      - name: Run all tests
        run: pytest -v
      - name: Dependency vulnerability scan (informational)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Dependency vulnerability scan (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f deployment/containers/api.Dockerfile -t verityai-api .
      - name: Build the gateway image
        run: docker build -f deployment/containers/gateway.Dockerfile -t verityai-gateway .
      - name: Check the release compose file is valid
        env:
          DB_OWNER_PASSWORD: ci-placeholder
          DB_APP_PASSWORD: ci_placeholder_value
          SECRET_KEY: ci-placeholder-secret-key-that-is-long-enough-0123456789
        run: docker compose -f docker-compose.release.yml config --quiet